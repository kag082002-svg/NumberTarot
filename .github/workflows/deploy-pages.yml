name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # enablement: true lets the workflow turn Pages on itself. Without it the
      # step fails with "Get Pages site failed ... Not Found" whenever Pages is
      # off in repo settings, which is what happened on the first deploy.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # Publish an explicit allowlist, never the whole repo: content/ holds the
      # source material the paid report is built from and scripts/ holds the
      # generation logic — neither belongs on a public URL. Anything not listed
      # here stays unpublished, including files added later.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html script.js style.css _site/
          cp -r lib _site/
          echo "Published files:" && find _site -type f | sort
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
