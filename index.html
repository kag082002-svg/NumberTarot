<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>占星數字塔羅</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>占星數字塔羅</h1>
    <p class="subtitle">輸入出生資訊，解讀你的 13 個占星數字</p>
  </header>

  <main class="layout">
    <section class="input-panel">
      <h2>出生資訊</h2>
      <form id="birth-form">
        <div class="field-row">
          <label for="year">年（西元）</label>
          <input type="number" id="year" min="1900" max="2100" placeholder="例如 1990" required>
        </div>
        <div class="field-row">
          <label for="month">月</label>
          <input type="number" id="month" min="1" max="12" placeholder="1-12" required>
        </div>
        <div class="field-row">
          <label for="day">日</label>
          <input type="number" id="day" min="1" max="31" placeholder="1-31" required>
        </div>

        <div class="field-row checkbox-row">
          <input type="checkbox" id="unknown-time">
          <label for="unknown-time">不知道確切的出生時間（將以中午 12:00 計算）</label>
        </div>

        <div id="time-fields">
          <div class="field-row">
            <label for="hour">時（0-23）</label>
            <input type="number" id="hour" min="0" max="23" placeholder="0-23">
          </div>
          <div class="field-row">
            <label for="minute">分（0-59）</label>
            <input type="number" id="minute" min="0" max="59" placeholder="0-59">
          </div>
        </div>

        <button type="submit">開始計算</button>
      </form>
      <p id="form-error" class="form-error" hidden></p>
    </section>

    <section class="result-panel">
      <h2>占星數字九宮格</h2>
      <p id="time-warning" class="time-warning" hidden>
        由於使用預設出生時間（12:00），<strong>天王星、海王星、北交、南交</strong>這四個與時、分相關的數字僅供參考，實際數值可能不準確。
      </p>
      <div id="grid" class="grid" hidden></div>
      <p id="grid-placeholder" class="grid-placeholder">請先在左側輸入出生資訊並送出</p>
      <div id="explanation" class="explanation" hidden></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>免費版僅提供基礎九宮格解讀，完整報告書將於付費版推出。</p>
  </footer>

<script src="lib/astrology.js"></script>
<script src="script.js"></script>
</body>
</html>
